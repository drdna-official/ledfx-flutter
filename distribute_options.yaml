output: dist/
releases:
  - name: production
    jobs:
      - name: android
        package:
          platform: android
          target: apk
          build_args:
            target-platform: android-arm,android-arm64
            split-per-abi: true
            obfuscate: true
            split-debug-info: build/app/outputs/symbols
      - name: ios
        package:
          platform: ios
          target: ipa
          build_args:
            export-options-plist: ios/ExportOptions.plist
      - name: linux
        package:
          platform: linux
          target: deb
          build_args:
            target-platform: linux-x64
      - name: windows
        package:
          platform: windows
          target: exe